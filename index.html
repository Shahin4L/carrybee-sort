
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarryBee | Video Display</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10141b;
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  height: 65px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #171e28;
  border-bottom: 1px solid #303947;
}

.logo {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #fff;
}

.logo span { color: #f5a623; }

.live {
  font-size: 12px;
  color: #42d392;
  font-weight: bold;
}

main {
  max-width: 1250px;
  margin: 45px auto;
  padding: 0 20px;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 10px;
}

h1 {
  font-size: 23px;
  margin: 0;
}

.subtitle {
  color: #9ba6b5;
  font-size: 13px;
  margin-top: 8px;
}

.player-box {
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #303947;
}

.video-area {
  width: 100%;
  aspect-ratio: 16 / 9;
  position: relative;
  background: #000;
}

#player {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
}

.controls {
  padding: 17px 20px;
  background: #1b232e;
}

.progress {
  width: 100%;
  margin-bottom: 15px;
  cursor: pointer;
  accent-color: #f5a623;
}

.control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.left, .right {
  display: flex;
  align-items: center;
  gap: 12px;
}

button {
  background: transparent;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 14px;
  padding: 9px;
  border-radius: 6px;
}

button:hover { background: #354252; }

.play-btn {
  background: #f5a623;
  color: #111;
  font-weight: bold;
  min-width: 90px;
}

.play-btn:hover { background: #ffc04c; }

#volume {
  width: 90px;
  accent-color: #f5a623;
  cursor: pointer;
}

#time {
  font-size: 12px;
  color: #b6c0cc;
  white-space: nowrap;
}

#status {
  color: #9ba6b5;
  font-size: 12px;
  margin-top: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #788494;
  font-size: 12px;
}

@media(max-width:600px) {
  main { margin: 25px auto; }
  h1 { font-size: 18px; }
  .controls { padding: 12px; }
  .control-row { flex-wrap: wrap; }
  #volume { width: 65px; }
  .left, .right { gap: 3px; }
  button { padding: 7px; }
}

:fullscreen .video-area {
  aspect-ratio: auto;
  height: calc(100vh - 105px);
}
</style>
</head>

<body>

<header>
  <div class="logo">Carry<span>Bee</span></div>
  <div class="live">● LIVE DISPLAY</div>
</header>

<main>

  <div class="heading">
    <div>
      <h1>Central Sort Operations</h1>
      <div class="subtitle">
        CarryBee Video Display & Continuous Playback
      </div>
    </div>
  </div>

  <div class="player-box" id="playerBox">

    <div class="video-area">
      <div id="player"></div>
    </div>

    <div class="controls">

      <input
        type="range"
        id="progress"
        class="progress"
        min="0"
        max="100"
        value="0"
        aria-label="Video progress"
      >

      <div class="control-row">

        <div class="left">
          <button class="play-btn" id="playBtn"
            onclick="togglePlay()">▶ Play</button>

          <button onclick="restartVideo()">↻</button>

          <span id="time">00:00 / 00:00</span>
        </div>

        <div class="right">
          <button id="muteBtn"
            onclick="toggleMute()">🔊</button>

          <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="60"
            aria-label="Volume"
          >

          <button onclick="toggleFullscreen()">⛶</button>
        </div>

      </div>

      <div id="status">Connecting to video...</div>

    </div>
  </div>

</main>

<footer>
  © CarryBee | Central Sort Operations
</footer>

<script>
const VIDEO_ID = "OtBtGI_HU30";

let player;
let ready = false;
let seeking = false;

const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volume");
const progress = document.getElementById("progress");
const statusText = document.getElementById("status");
const timeText = document.getElementById("time");

function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function() {

  player = new YT.Player("player", {
    videoId: VIDEO_ID,

    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: VIDEO_ID,
      mute: 1,
      modestbranding: 1
    },

    events: {
      onReady: function(event) {
        ready = true;

        event.target.setVolume(60);
        event.target.mute();
        event.target.playVideo();

        statusText.textContent =
          "Video ready | Continuous loop enabled";

        updateButtons();
      },

      onStateChange: function(event) {
        updateButtons();

        if(event.data === YT.PlayerState.PLAYING) {
          statusText.textContent =
            "Playing | Continuous loop enabled";
        }

        if(event.data === YT.PlayerState.ENDED) {
          player.seekTo(0, true);
          player.playVideo();
        }

        if(event.data === YT.PlayerState.PAUSED) {
          statusText.textContent = "Video paused";
        }

        if(event.data === YT.PlayerState.BUFFERING) {
          statusText.textContent = "Buffering video...";
        }
      },

      onError: function() {
        statusText.textContent =
          "Video unavailable or embedding is restricted.";
      }
    }
  });
};

function togglePlay() {
  if(!ready) return;

  if(player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function restartVideo() {
  if(!ready) return;
  player.seekTo(0, true);
  player.playVideo();
}

function toggleMute() {
  if(!ready) return;

  if(player.isMuted()) {
    player.unMute();
    player.setVolume(Number(volumeSlider.value) || 60);
    player.playVideo();
  } else {
    player.mute();
  }

  updateButtons();
}

volumeSlider.addEventListener("input", function() {
  if(!ready) return;

  const value = Number(this.value);
  player.setVolume(value);

  if(value === 0) {
    player.mute();
  } else {
    player.unMute();
  }

  updateButtons();
});

function updateButtons() {
  if(!ready) return;

  const state = player.getPlayerState();

  playBtn.textContent =
    state === YT.PlayerState.PLAYING ? "Ⅱ Pause" : "▶ Play";

  muteBtn.textContent =
    player.isMuted() || player.getVolume() === 0 ? "🔇" : "🔊";
}

function formatTime(seconds) {
  if(!Number.isFinite(seconds)) return "00:00";

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);

  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

progress.addEventListener("input", function() {
  seeking = true;
});

progress.addEventListener("change", function() {
  if(!ready) return;

  const duration = player.getDuration();
  const target = duration * (Number(this.value) / 100);

  player.seekTo(target, true);
  seeking = false;
});

function updateProgress() {
  if(ready) {
    const duration = player.getDuration();
    const current = player.getCurrentTime();

    if(duration > 0) {
      if(!seeking) {
        progress.value = (current / duration) * 100;
      }

      timeText.textContent =
        formatTime(current) + " / " + formatTime(duration);
    }

    updateButtons();
  }
}

function toggleFullscreen() {
  const box = document.getElementById("playerBox");

  if(!document.fullscreenElement) {
    if(box.requestFullscreen) {
      box.requestFullscreen();
    }
  } else {
    document.exitFullscreen();
  }
}

setInterval(updateProgress, 1000);

loadYouTubeAPI();
</script>

</body>
</html>
