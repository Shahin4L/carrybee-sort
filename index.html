
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101722">

<title>CarryBee | Central Sort Operations</title>

<style>
:root {
  --bg: #0c121c;
  --panel: #151f2d;
  --panel2: #1b2838;
  --amber: #f5a623;
  --amber2: #ffbd4a;
  --text: #f5f7fa;
  --muted: #92a0b2;
  --border: rgba(255,255,255,.09);
  --green: #36cf91;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% -20%, #243449 0%, transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
}

button {
  font: inherit;
}

.topbar {
  height: 76px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(13,20,31,.9);
  backdrop-filter: blur(15px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--amber);
  color: #15191f;
  font-size: 23px;
  font-weight: 900;
  box-shadow: 0 5px 20px #f5a62335;
}

.brand-name {
  font-size: 23px;
  font-weight: 850;
  letter-spacing: -.8px;
}

.brand-name span {
  color: var(--amber);
}

.brand-sub {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 3px;
  text-transform: uppercase;
}

.live {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  padding: 10px 15px;
  border: 1px solid #36cf9140;
  background: #36cf9110;
  border-radius: 30px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
}

main {
  max-width: 1450px;
  margin: 0 auto;
  padding: 48px 32px 35px;
}

.intro {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 24px;
}

.eyebrow {
  color: var(--amber);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
  margin-bottom: 10px;
}

h1 {
  font-size: clamp(23px,3vw,34px);
  letter-spacing: -1px;
  margin: 0;
  font-weight: 800;
}

.description {
  color: var(--muted);
  font-size: 14px;
  margin-top: 9px;
}

.display-tag {
  border: 1px solid var(--border);
  background: var(--panel);
  padding: 11px 15px;
  color: #c7d1dc;
  border-radius: 9px;
  font-size: 11px;
  white-space: nowrap;
}

.player-card {
  border: 1px solid var(--border);
  background: #111a26;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 25px 80px #00000055;
}

.video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}

#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.player-card:fullscreen {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 0;
  background: #000;
  display: flex;
  flex-direction: column;
}

.player-card:fullscreen .video-wrap {
  flex: 1;
  min-height: 0;
  aspect-ratio: auto;
}

.player-card:fullscreen .control-panel {
  flex-shrink: 0;
  padding: 10px 28px;
}

.control-panel {
  padding: 20px 24px;
  background: linear-gradient(120deg,#172231,#111a26);
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 17px;
}

.time {
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

input[type=range] {
  appearance: none;
  -webkit-appearance: none;
  height: 5px;
  border-radius: 20px;
  outline: none;
  background: #364354;
  cursor: pointer;
}

input[type=range]::-webkit-slider-thumb {
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 10px #f5a62370;
}

input[type=range]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: none;
  border-radius: 50%;
  background: var(--amber);
}

#progress {
  flex: 1;
  accent-color: var(--amber);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.toolbar-left, .toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.control-btn {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: #d8e0ea;
  background: #ffffff09;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: .2s;
  font-size: 17px;
}

.control-btn:hover {
  color: var(--amber);
  background: #f5a62315;
  border-color: #f5a62360;
  transform: translateY(-1px);
}

.play-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  height: 43px;
  min-width: 112px;
  padding: 0 17px;
  background: var(--amber);
  border: none;
  border-radius: 10px;
  color: #15191f;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.play-btn:hover {
  background: var(--amber2);
  transform: translateY(-1px);
  box-shadow: 0 5px 20px #f5a62335;
}

.volume-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
}

#volume {
  width: 85px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 17px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
}

.status-indicator {
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 22px 4px;
  color: #77879b;
  font-size: 11px;
  letter-spacing: .3px;
}

.footer strong {
  color: #c4cbd4;
}

.hidden {
  display: none !important;
}

.player-card:fullscreen .status {
  display: none;
}

@media(max-width:650px) {
  .topbar {
    height: 65px;
    padding: 0 17px;
  }

  .brand-name {
    font-size: 19px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
  }

  .live {
    font-size: 9px;
    padding: 8px 10px;
  }

  main {
    padding: 28px 12px;
  }

  .intro {
    align-items: flex-start;
    flex-direction: column;
  }

  .display-tag {
    display: none;
  }

  .player-card {
    border-radius: 12px;
  }

  .control-panel {
    padding: 13px 12px;
  }

  .toolbar {
    flex-wrap: wrap;
  }

  .toolbar-left, .toolbar-right {
    gap: 6px;
  }

  .control-btn {
    width: 36px;
    height: 36px;
  }

  .play-btn {
    min-width: 95px;
    height: 38px;
    font-size: 12px;
  }

  #volume {
    width: 55px;
  }

  .volume-box {
    gap: 5px;
    padding: 0;
  }

  .footer {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">C</div>
    <div>
      <div class="brand-name">Carry<span>Bee</span></div>
      <div class="brand-sub">Express Logistics</div>
    </div>
  </div>

  <div class="live">
    <span class="dot"></span>
    LIVE DISPLAY
  </div>
</header>

<main>

  <section class="intro">
    <div>
      <div class="eyebrow">OPERATIONS • VIDEO DISPLAY</div>
      <h1>Central Sort Operations</h1>
      <div class="description">
        Operational Workflow & Process Display
      </div>
    </div>

    <div class="display-tag">
      ◈ PROFESSIONAL DISPLAY SYSTEM
    </div>
  </section>

  <section class="player-card" id="playerCard">

    <div class="video-wrap">
      <div id="player"></div>
    </div>

    <div class="control-panel">

      <div class="progress-row">
        <span class="time" id="currentTime">00:00</span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Video progress"
        >

        <span class="time" id="duration">00:00</span>
      </div>

      <div class="toolbar">

        <div class="toolbar-left">

          <button class="play-btn" id="playBtn"
            onclick="togglePlay()">
            <span id="playIcon">▶</span>
            <span id="playText">Play</span>
          </button>

          <button class="control-btn"
            onclick="restartVideo()"
            title="Restart" aria-label="Restart">
            ↻
          </button>

        </div>

        <div class="toolbar-right">

          <div class="volume-box">

            <button class="control-btn"
              id="muteBtn"
              onclick="toggleMute()"
              title="Mute / Unmute"
              aria-label="Mute or unmute">
              ◖
            </button>

            <input
              type="range"
              id="volume"
              min="0"
              max="100"
              value="60"
              aria-label="Volume"
            >

          </div>

          <button class="control-btn"
            id="fullscreenBtn"
            onclick="toggleFullscreen()"
            title="Full Page View"
            aria-label="Fullscreen">
            ⛶
          </button>

        </div>

      </div>

      <div class="status">
        <span class="status-indicator" id="statusDot"></span>
        <span id="statusText">Initializing video display...</span>
      </div>

    </div>
  </section>

  <footer class="footer">
    <div><strong>CarryBee</strong> | Central Sort Operations</div>
    <div>Professional Operations Display</div>
  </footer>

</main>

<script>
const VIDEO_ID = "OtBtGI_HU30";

let player = null;
let ready = false;
let seeking = false;
let lastVolume = 60;

const el = id => document.getElementById(id);

function setStatus(message, active = true) {
  el("statusText").textContent = message;
  el("statusDot").style.background =
    active ? "#36cf91" : "#f5a623";
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "00:00";

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);

  if (h > 0) {
    return [h,m,s].map(v =>
      String(v).padStart(2,"0")
    ).join(":");
  }

  return [m,s].map(v =>
    String(v).padStart(2,"0")
  ).join(":");
}

function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) {
    createPlayer();
    return;
  }

  window.onYouTubeIframeAPIReady = createPlayer;

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  script.async = true;

  script.onerror = () => {
    setStatus("Unable to initialize video. Check your connection.", false);
  };

  document.head.appendChild(script);
}

function createPlayer() {

  if (player) return;

  player = new YT.Player("player", {
    videoId: VIDEO_ID,

    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: VIDEO_ID,
      mute: 1,
      fs: 0,
      iv_load_policy: 3
    },

    events: {

      onReady: function(event) {
        ready = true;

        event.target.setVolume(lastVolume);
        event.target.mute();
        event.target.playVideo();

        setStatus("Video display initialized");
        updateControls();
      },

      onStateChange: function(event) {

        updateControls();

        if(event.data === YT.PlayerState.PLAYING) {
          setStatus("Video is playing");
        }

        if(event.data === YT.PlayerState.PAUSED) {
          setStatus("Playback paused", false);
        }

        if(event.data === YT.PlayerState.BUFFERING) {
          setStatus("Preparing video...", false);
        }

        if(event.data === YT.PlayerState.ENDED) {
          player.seekTo(0, true);
          player.playVideo();
        }
      },

      onError: function() {
        setStatus(
          "Video unavailable. Please check video permissions.",
          false
        );
      }
    }
  });
}

function togglePlay() {
  if(!ready) return;

  if(player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function restartVideo() {
  if(!ready) return;

  player.seekTo(0, true);
  player.playVideo();
}

function toggleMute() {
  if(!ready) return;

  if(player.isMuted() || player.getVolume() === 0) {
    player.unMute();
    player.setVolume(lastVolume || 60);
  } else {
    lastVolume = player.getVolume();
    player.mute();
  }

  updateControls();
}

el("volume").addEventListener("input", function() {

  if(!ready) return;

  const value = Number(this.value);

  if(value > 0) lastVolume = value;

  player.setVolume(value);

  if(value === 0) {
    player.mute();
  } else {
    player.unMute();
  }

  updateControls();
});

el("progress").addEventListener("input", function() {
  seeking = true;
});

el("progress").addEventListener("change", function() {

  if(!ready) return;

  const duration = player.getDuration();

  if(duration > 0) {
    player.seekTo(duration * Number(this.value) / 100, true);
  }

  seeking = false;
});

function updateControls() {
  if(!ready) return;

  const playing =
    player.getPlayerState() === YT.PlayerState.PLAYING;

  el("playIcon").textContent = playing ? "Ⅱ" : "▶";
  el("playText").textContent = playing ? "Pause" : "Play";

  el("muteBtn").textContent =
    player.isMuted() || player.getVolume() === 0
      ? "×"
      : "◖";
}

function updateProgress() {
  if(!ready) return;

  const duration = player.getDuration();
  const current = player.getCurrentTime();

  el("currentTime").textContent = formatTime(current);
  el("duration").textContent = formatTime(duration);

  if(duration > 0 && !seeking) {
    el("progress").value = current / duration * 100;
  }

  updateControls();
}

function toggleFullscreen() {

  const card = el("playerCard");

  if(!document.fullscreenElement) {

    if(card.requestFullscreen) {
      card.requestFullscreen();
    } else if(card.webkitRequestFullscreen) {
      card.webkitRequestFullscreen();
    }

  } else {

    if(document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

document.addEventListener("fullscreenchange", function() {

  const full = !!document.fullscreenElement;

  el("fullscreenBtn").textContent = full ? "⛶" : "⛶";

  if(ready && full) {
    setTimeout(() => {
      player.playVideo();
    }, 300);
  }
});

/* Keyboard shortcuts */

document.addEventListener("keydown", function(event) {

  if(event.target.tagName === "INPUT") return;

  if(event.code === "Space") {
    event.preventDefault();
    togglePlay();
  }

  if(event.key.toLowerCase() === "m") {
    toggleMute();
  }

  if(event.key.toLowerCase() === "f") {
    toggleFullscreen();
  }

  if(event.key.toLowerCase() === "r") {
    restartVideo();
  }

  if(event.key === "Escape" && document.fullscreenElement) {
    document.exitFullscreen();
  }
});

setInterval(updateProgress, 1000);

loadYouTubeAPI();
</script>

</body>
</html>
