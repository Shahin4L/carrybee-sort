
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CarryBee | Video Display</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10141b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 60px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #171e28;
  border-bottom: 1px solid #303947;
}

.logo {
  font-size: 23px;
  font-weight: 800;
}

.logo span { color: #f5a623; }

.live {
  color: #42d392;
  font-size: 12px;
  font-weight: bold;
}

main {
  max-width: 1300px;
  margin: 35px auto;
  padding: 0 20px;
}

.heading {
  margin-bottom: 18px;
}

.heading h1 {
  font-size: 23px;
  margin: 0;
}

.subtitle {
  color: #9ba6b5;
  font-size: 13px;
  margin-top: 7px;
}

.player-box {
  width: 100%;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #303947;
}

.video-area {
  width: 100%;
  aspect-ratio: 16 / 9;
  position: relative;
  background: #000;
}

#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.controls {
  padding: 15px 20px;
  background: #171e28;
}

.progress {
  width: 100%;
  accent-color: #f5a623;
  cursor: pointer;
  margin-bottom: 12px;
}

.control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.left, .right {
  display: flex;
  align-items: center;
  gap: 12px;
}

button {
  border: none;
  border-radius: 6px;
  background: transparent;
  color: white;
  padding: 9px 12px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #354252;
}

.play-btn {
  background: #f5a623;
  color: #111;
  font-weight: bold;
  min-width: 85px;
}

.play-btn:hover {
  background: #ffc04c;
}

#volume {
  width: 90px;
  accent-color: #f5a623;
  cursor: pointer;
}

#time {
  font-size: 12px;
  color: #b6c0cc;
  white-space: nowrap;
}

footer {
  text-align: center;
  color: #788494;
  font-size: 12px;
  padding: 25px;
}

/* FULL PAGE MODE */

.player-box:fullscreen {
  width: 100%;
  height: 100%;
  max-width: none;
  border: none;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  background: #000;
}

.player-box:fullscreen .video-area {
  flex: 1;
  min-height: 0;
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
}

.player-box:fullscreen #player {
  width: 100%;
  height: 100%;
}

.player-box:fullscreen .controls {
  flex-shrink: 0;
  padding: 10px 22px;
}

.player-box:fullscreen .progress {
  margin-bottom: 5px;
}

@media(max-width:600px) {
  main { margin: 20px auto; }
  .heading h1 { font-size: 19px; }
  .controls { padding: 10px; }
  .left, .right { gap: 3px; }
  button { padding: 8px; }
  #volume { width: 60px; }
  .control-row { flex-wrap: wrap; }
}

</style>
</head>

<body>

<header>
  <div class="logo">Carry<span>Bee</span></div>
  <div class="live">● LIVE DISPLAY</div>
</header>

<main>

  <div class="heading">
    <h1>Central Sort Operations</h1>
    <div class="subtitle">
      CarryBee Video Display
    </div>
  </div>

  <div class="player-box" id="playerBox">

    <div class="video-area">
      <div id="player"></div>
    </div>

    <div class="controls">

      <input
        type="range"
        id="progress"
        class="progress"
        min="0"
        max="100"
        value="0"
        aria-label="Video progress"
      >

      <div class="control-row">

        <div class="left">

          <button class="play-btn"
            id="playBtn"
            onclick="togglePlay()">▶ Play</button>

          <button onclick="restartVideo()" title="Restart">
            ↻
          </button>

          <span id="time">00:00 / 00:00</span>

        </div>

        <div class="right">

          <button id="muteBtn"
            onclick="toggleMute()"
            title="Mute / Unmute">🔊</button>

          <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="60"
            aria-label="Volume"
          >

          <button onclick="toggleFullscreen()"
            id="fullscreenBtn"
            title="Full Page View">⛶</button>

        </div>

      </div>
    </div>

  </div>

</main>

<footer>
  © CarryBee | Central Sort Operations
</footer>

<script>

const VIDEO_ID = "OtBtGI_HU30";

let player;
let ready = false;
let seeking = false;

const playBtn = document.getElementById("playBtn");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volume");
const progress = document.getElementById("progress");
const timeText = document.getElementById("time");
const playerBox = document.getElementById("playerBox");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function loadYouTubeAPI() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function() {

  player = new YT.Player("player", {

    videoId: VIDEO_ID,

    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      playsinline: 1,
      rel: 0,
      loop: 1,
      playlist: VIDEO_ID,
      mute: 1
    },

    events: {

      onReady: function(event) {
        ready = true;

        event.target.setVolume(60);
        event.target.mute();
        event.target.playVideo();

        updateButtons();
      },

      onStateChange: function(event) {

        updateButtons();

        if(event.data === YT.PlayerState.ENDED) {
          player.seekTo(0, true);
          player.playVideo();
        }
      },

      onError: function() {
        playBtn.textContent = "Video Unavailable";
      }
    }
  });
};

function togglePlay() {
  if(!ready) return;

  if(player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function restartVideo() {
  if(!ready) return;

  player.seekTo(0, true);
  player.playVideo();
}

function toggleMute() {
  if(!ready) return;

  if(player.isMuted()) {
    player.unMute();
    player.setVolume(Number(volumeSlider.value) || 60);
  } else {
    player.mute();
  }

  updateButtons();
}

volumeSlider.addEventListener("input", function() {

  if(!ready) return;

  const value = Number(this.value);

  player.setVolume(value);

  if(value === 0) {
    player.mute();
  } else {
    player.unMute();
  }

  updateButtons();
});

function updateButtons() {
  if(!ready) return;

  const state = player.getPlayerState();

  playBtn.textContent =
    state === YT.PlayerState.PLAYING ? "Ⅱ Pause" : "▶ Play";

  muteBtn.textContent =
    player.isMuted() || player.getVolume() === 0 ? "🔇" : "🔊";
}

function formatTime(seconds) {

  if(!Number.isFinite(seconds)) return "00:00";

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);

  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

progress.addEventListener("input", function() {
  seeking = true;
});

progress.addEventListener("change", function() {

  if(!ready) return;

  const duration = player.getDuration();
  const target = duration * (Number(this.value) / 100);

  player.seekTo(target, true);
  seeking = false;
});

function updateProgress() {

  if(!ready) return;

  const duration = player.getDuration();
  const current = player.getCurrentTime();

  if(duration > 0) {

    if(!seeking) {
      progress.value = (current / duration) * 100;
    }

    timeText.textContent =
      formatTime(current) + " / " + formatTime(duration);
  }

  updateButtons();
}

/* FULL PAGE TOGGLE */

function toggleFullscreen() {

  if(!document.fullscreenElement) {

    if(playerBox.requestFullscreen) {
      playerBox.requestFullscreen();
    }

  } else {

    document.exitFullscreen();
  }
}

document.addEventListener("fullscreenchange", function() {

  const isFull = !!document.fullscreenElement;

  fullscreenBtn.textContent = isFull ? "⛶ Exit" : "⛶";

  if(ready) {
    setTimeout(function() {
      player.playVideo();
    }, 300);
  }
});

setInterval(updateProgress, 1000);

loadYouTubeAPI();

</script>

</body>
</html>
